name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  # Regla 25: un PR que cambia código debe actualizar estado-del-proyecto.md ("sin-estado" lo omite).
  estado-del-proyecto:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'sin-estado')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/verificar-estado.sh "origin/${{ github.base_ref }}"

  # Regla 26: el mismo comando que el candado. Linux basta para KayucoCore (Swift Package);
  # lo que requiera macOS (host, menu bar) se compila en Xcode Cloud, no aquí (regla 23).
  # Imagen oficial de Swift en vez de setup-swift: no depende de la versión de Ubuntu del runner.
  # 6.1 = la swift-tools-version mínima de los paquetes; si compila aquí, compila en Xcode.
  check:
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check.sh
